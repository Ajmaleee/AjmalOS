name: Build Ajmal OS

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed, so install Gradle 8.5 (compatible with AGP 8.2.2).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Lint (non-blocking)
        run: gradle --no-daemon :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Build release APK (debug-signed, minified)
        run: gradle --no-daemon :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Verify APK (package, SDK levels, ABI)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|native-code|launchable-activity" || true
          echo "--- HOME intent filter present?"
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -B2 -A2 "HOME" || true

      - uses: actions/upload-artifact@v4
        with:
          name: AjmalOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AjmalOS-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
